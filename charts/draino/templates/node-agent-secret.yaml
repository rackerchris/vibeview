{{/*
  Two secrets with deliberately different trust scopes:
  - <fullname>-node-agent-tls: CA + server cert/key, mounted only by the agent pods.
    The web pod mounts only the ca.crt item (it needs to verify agents, never
    to impersonate them).
  - <fullname>-node-agent-token: the shared bearer token, mounted by web and agents.
  Keeping the server private key out of the web pod means a web-pod compromise
  yields "can request reboots" (token) but not "can impersonate any agent" (key).
*/}}
{{- $tlsName := include "draino.nodeAgentTlsSecretName" . -}}
{{- $tokenName := include "draino.nodeAgentTokenSecretName" . -}}
{{- $serviceName := include "draino.nodeAgentName" . -}}
{{- $existingTls := lookup "v1" "Secret" .Release.Namespace $tlsName -}}
{{- $existingToken := lookup "v1" "Secret" .Release.Namespace $tokenName -}}
{{- if $existingTls }}
{{- $ca := get $existingTls.data "ca.crt" -}}
{{- $crt := get $existingTls.data "tls.crt" -}}
{{- $key := get $existingTls.data "tls.key" -}}
{{- if and $ca $crt $key }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tlsName }}
  labels:
    {{- include "draino.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
type: Opaque
data:
  ca.crt: {{ $ca }}
  tls.crt: {{ $crt }}
  tls.key: {{ $key }}
{{- else }}
{{- $caObj := genCA (printf "%s-node-agent-ca" (include "draino.fullname" .)) 3650 -}}
{{- $dnsNames := list
    $serviceName
    (printf "%s.%s" $serviceName .Release.Namespace)
    (printf "%s.%s.svc" $serviceName .Release.Namespace)
    (printf "%s.%s.svc.cluster.local" $serviceName .Release.Namespace)
    (printf "*.%s.%s.svc" $serviceName .Release.Namespace)
    (printf "*.%s.%s.svc.cluster.local" $serviceName .Release.Namespace)
-}}
{{- $cert := genSignedCert $serviceName nil $dnsNames 3650 $caObj -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tlsName }}
  labels:
    {{- include "draino.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
type: Opaque
data:
  ca.crt: {{ $caObj.Cert | b64enc }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
{{- else }}
{{- $ca := genCA (printf "%s-node-agent-ca" (include "draino.fullname" .)) 3650 -}}
{{- $dnsNames := list
    $serviceName
    (printf "%s.%s" $serviceName .Release.Namespace)
    (printf "%s.%s.svc" $serviceName .Release.Namespace)
    (printf "%s.%s.svc.cluster.local" $serviceName .Release.Namespace)
    (printf "*.%s.%s.svc" $serviceName .Release.Namespace)
    (printf "*.%s.%s.svc.cluster.local" $serviceName .Release.Namespace)
-}}
{{- $cert := genSignedCert $serviceName nil $dnsNames 3650 $ca -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tlsName }}
  labels:
    {{- include "draino.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
type: Opaque
data:
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
---
{{- if $existingToken }}
{{- $token := get $existingToken.data "token" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tokenName }}
  labels:
    {{- include "draino.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
type: Opaque
data:
  {{- if $token }}
  token: {{ $token }}
  {{- else }}
  token: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tokenName }}
  labels:
    {{- include "draino.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
type: Opaque
data:
  token: {{ randAlphaNum 48 | b64enc }}
{{- end }}
