replicaCount: 1  # >1 requires the sticky routing below (sessions are pod-local)

# Operation-lock lease TTL in seconds (cluster-wide action exclusivity).
# A dead web pod's locks self-release after this long.
drainoLeaseSeconds: 60

image:
  repository: ghcr.io/busterswt/vibeview
  tag: main
  pullPolicy: IfNotPresent

imagePullSecrets: []
buildSha: ""
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  # Sessions are pod-local until the shared-session-store decision; sticky
  # routing lets you run >1 replica without breaking logins.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600

nodeAgent:
  profile: unprivileged
  port: 8443
  networkPolicy:
    # Restrict agent ingress to the VibeView web pods. Requires a CNI that
    # enforces NetworkPolicy; enabling kubelet probes still work (they bypass
    # policy on most CNIs) — verify before enabling on managed clusters.
    enabled: true
  labelSelector: ""
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 2
  podAnnotations: {}
  privilegedHostPID: true
  unprivilegedHostPID: false
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: openstack-compute-node
                operator: In
                values:
                  - enabled
          - matchExpressions:
              - key: openstack-network-node
                operator: In
                values:
                  - enabled
          - matchExpressions:
              - key: openstack-control-plane
                operator: In
                values:
                  - enabled
          - matchExpressions:
              - key: openstack-storage-node
                operator: In
                values:
                  - enabled
  privilegedSecurityContext:
    privileged: true
    allowPrivilegeEscalation: true
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
  unprivilegedSecurityContext:
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001

gateway:
  enabled: true
  gatewayClassName: envoy-gateway-class
  create: false
  name: shared-gateway
  namespace: ""
  parentRefs:
    - name: shared-gateway
      namespace: ""
      sectionName: https
  annotations: {}
  hostnames:
    - draino.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts: {}
  tls:
    enabled: false
    mode: Terminate
    certificateRefs: []

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

extraEnv: []

auditLog:
  path: /tmp/draino-audit.log

tmpVolume:
  enabled: true

serviceAccount:
  create: false
  automountServiceAccountToken: false
  annotations: {}
  name: ""
